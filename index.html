@media (max-width:860px){.stage.two{grid-template-columns:1fr}.controls{grid-template-columns:1fr}.app{padding:16px}h1{font-size:20px;line-height:28px}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <filter id="f-marble" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.014 0.045" numOctaves="5" seed="7"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.45  0 0 0 0 0.47  0 0 0 0 0.5  0 0 0 -9 4.6"/>
    </filter>
    <filter id="f-wood" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.004 0.16" numOctaves="3" seed="3"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.25  0 0 0 0 0.14  0 0 0 0 0.06  0 0 0 -2.2 1.3"/>
    </filter>
    <filter id="f-stone" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" seed="11"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 -1.2 0.9"/>
    </filter>
    <filter id="f-soft" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="9"/></filter>
  </defs>
</svg>

<div class="app">
  <header>
    <h1>인덕션 컬러 매칭</h1>
    <div class="bar">
      <div class="seg" role="group" aria-label="제품 각도">
        <button data-a="top" aria-pressed="false">위에서</button>
        <button data-a="front" aria-pressed="false">정면</button>
        <button data-a="tq" aria-pressed="false">비스듬히</button>
      </div>
      <div class="seg" role="group" aria-label="보기 방식">
        <button id="v-one" aria-pressed="false">하나씩 보기</button>
        <button id="v-two" aria-pressed="false">화이트·블랙 비교</button>
      </div>
    </div>
  </header>

  <section class="group" id="model-sec"><h2>제품 모델 <span id="n-model"></span></h2><div class="models" id="c-model"></div></section>

  <section class="stage" id="stage" aria-live="polite"></section>

  <section class="controls">
    <div class="group"><h2>상판 <span id="n-top"></span></h2><div class="chips" id="c-top"></div></div>
    <div class="group"><h2>하부장 <span id="n-cab"></span></h2><div class="chips" id="c-cab"></div></div>
    <div class="group"><h2>벽면 <span id="n-wall"></span></h2><div class="chips" id="c-wall"></div></div>
  </section>
  <p class="note">제품은 실제 이미지(화이트)입니다. 블랙은 이미지가 준비되기 전까지 화이트를 색 반전한 임시 시뮬레이션이라 실제 색감과 다릅니다. 주방 배경은 시연용 일러스트입니다.</p>
</div>

  var S={model:MODELS[0].id,top:'wm',cab:'w',wall:'wt',angle:'tq',view:'one',one:'white'};

  var find=function(a,id){for(var i=0;i<a.length;i++)if(a[i].id===id)return a[i]};

  function scene(color){
    var t=find(TOPS,S.top), c=find(CABS,S.cab), w=find(WALLS,S.wall);
    var black=color==='black', a=S.angle, flat=(a==='top');
    var W=1000,H=640;
    var s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+(black?'블랙':'화이트')+' 인덕션을 '+t.name+' 상판에 놓은 모습">';
    var wallH=flat?50:110, cTop=wallH, cFront=flat?570:520;
    // wall tiles
    s+='<rect width="'+W+'" height="'+wallH+'" fill="'+w.c+'"/>';
    if(w.img) s+='<pattern id="wp-'+color+'" patternUnits="userSpaceOnUse" width="360" height="360"><image href="'+w.img+'" width="360" height="360"/></pattern><rect width="'+W+'" height="'+wallH+'" fill="url(#wp-'+color+')"/>';
    var rows=w.img?-1:Math.ceil(wallH/36);
    for(var r=0;r<=rows;r++){
      var y=r*36; if(y<=wallH) s+='<line x1="0" x2="'+W+'" y1="'+y+'" y2="'+y+'" stroke="'+w.g+'" stroke-width="1.5"/>';
      for(var x=(r%2?45:0);x<W;x+=90){ var y2=Math.min(y+36,wallH); if(y<wallH) s+='<line x1="'+x+'" x2="'+x+'" y1="'+y+'" y2="'+y2+'" stroke="'+w.g+'" stroke-width="1.5"/>'; }
    }
    // counter
    var pts=[[0,cTop],[W,cTop],[W,cFront],[0,cFront]];
    var tp=pts.map(function(p){return p.join(',')}).join(' ');
    s+='<polygon points="'+tp+'" fill="'+t.base+'"/>';
    if(t.img) s+='<image href="'+t.img+'" x="0" y="'+cTop+'" width="'+W+'" height="'+(cFront-cTop)+'" preserveAspectRatio="xMidYMid slice"/>';
    if(t.tex==='marble') s+='<polygon points="'+tp+'" filter="url(#f-marble)" opacity=".26"/>';
    if(t.tex==='wood') s+='<polygon points="'+tp+'" filter="url(#f-wood)" opacity=".55"/>';
    if(t.tex==='stone') s+='<polygon points="'+tp+'" filter="url(#f-stone)" opacity=".18"/>';
    s+='<linearGradient id="sh-'+color+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000" stop-opacity=".16"/><stop offset=".45" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity=".10"/></linearGradient>';
    s+='<polygon points="'+tp+'" fill="url(#sh-'+color+')"/>';
    // front edge + cabinet
    s+='<rect x="0" y="'+cFront+'" width="'+W+'" height="14" fill="'+t.edge+'"/>';
    var cy=cFront+14, ch=H-cy;
    s+='<rect x="0" y="'+cy+'" width="'+W+'" height="'+ch+'" fill="'+c.c+'"/><rect x="0" y="'+cy+'" width="'+W+'" height="'+ch+'" fill="#000" opacity=".06"/>';
    [[0,340],[340,320],[660,340]].forEach(function(d){
      s+='<rect x="'+(d[0]+8)+'" y="'+(cy+10)+'" width="'+(d[1]-16)+'" height="'+(ch-10)+'" rx="3" fill="'+c.c+'" stroke="#000" stroke-opacity=".16" stroke-width="1.5"/>';
      s+='<rect x="'+(d[0]+d[1]/2-30)+'" y="'+(cy+16)+'" width="60" height="5" rx="2.5" fill="'+c.h+'"/>';
    });
    // product
    var pw=flat?540:(a==='front'?780:760);
    var M=find(MODELS,S.model), sz=M.sz[a], ph=Math.round(pw*sz[1]/sz[0]);
    var px=Math.round((W-pw)/2);
    var py=flat?Math.round(cTop+(cFront-cTop-ph)/2+6):(a==='front'?cFront-ph-60:cFront-ph-95);
    // shadow
    if(flat){
      s+='<rect x="'+(px+6)+'" y="'+(py+14)+'" width="'+pw+'" height="'+ph+'" rx="14" fill="#000" opacity=".32" filter="url(#f-soft)"/>';
    } else if(a==='front'){
      s+='<ellipse cx="'+(W/2)+'" cy="'+(py+ph-10)+'" rx="'+(pw*.46)+'" ry="14" fill="#000" opacity=".4" filter="url(#f-soft)"/>';
    } else {
      s+='<polygon points="'+[[0,.41],[.41,0],[1,.37],[.65,1]].map(function(p){return Math.round(px+p[0]*pw+10)+','+Math.round(py+p[1]*ph+16)}).join(' ')+'" fill="#000" opacity=".4" filter="url(#f-soft)"/>';
    }
    var fl=(black&&!M.black)?' style="filter:invert(1) brightness(.92) contrast(1.08)"':'';
    s+='<image href="'+((black&&M.black)?M.black[a]:M.img[a])+'" x="'+px+'" y="'+py+'" width="'+pw+'" height="'+ph+'"'+fl+'/>';
    s+='</svg>';
    return s;
  }

  function card(color){
    var M=find(MODELS,S.model); var label=color==='black'?(M.black?'블랙':'블랙 (임시 시뮬레이션)'):'화이트';
    return '<div class="card"><div class="cap">'+label+'<span>'+M.name+'</span></div>'+scene(color)+'</div>';
  }

  function drawStage(){
    var st=$('stage');
    if(S.view==='two'){ st.className='stage two'; st.innerHTML=card('white')+card('black'); }
    else {
      st.className='stage';
      var cur=S.one;
      st.innerHTML='<div class="seg" role="group" aria-label="제품 컬러" style="justify-self:start"><button data-c="white" aria-pressed="'+(cur==='white')+'">화이트</button><button data-c="black" aria-pressed="'+(cur==='black')+'">블랙</button></div>'+card(cur);
      Array.prototype.forEach.call(st.querySelectorAll('[data-c]'),function(b){
        b.onclick=function(){S.one=b.getAttribute('data-c');drawStage()};
      });
    }
  }

  function chips(host,list,key,swatch,nameEl){
    var el=$(host); el.innerHTML='';
    list.forEach(function(o){
      var b=document.createElement('button');
      b.className='chip'; b.type='button';
      b.setAttribute('aria-pressed',S[key]===o.id);
      b.innerHTML='<i style="background:'+swatch(o)+'"></i>'+o.name;
      b.onclick=function(){S[key]=o.id;render()};
      el.appendChild(b);
    });
    $(nameEl).textContent=find(list,S[key]).name;
  }

  function drawModels(){
    var el=$('c-model'); el.innerHTML='';
    MODELS.forEach(function(m){
      var b=document.createElement('button'); b.type='button'; b.className='mbtn'; b.textContent=m.name;
      b.setAttribute('aria-pressed',S.model===m.id);
      b.onclick=function(){S.model=m.id;render()};
      el.appendChild(b);
    });
    $('n-model').textContent=find(MODELS,S.model).name;
  }

  function syncToggles(){
    $('v-one').setAttribute('aria-pressed',S.view==='one');
    $('v-two').setAttribute('aria-pressed',S.view==='two');
    Array.prototype.forEach.call(document.querySelectorAll('[data-a]'),function(b){
      b.setAttribute('aria-pressed',b.getAttribute('data-a')===S.angle);
    });
  }

  function render(){
    syncToggles();
    drawModels();
    drawStage();
    chips('c-top',TOPS,'top',function(o){
      if(o.thumb) return 'url('+o.thumb+') center/cover';
      var extra=o.tex==='wood'?'repeating-linear-gradient(90deg,rgba(0,0,0,.12) 0 2px,transparent 2px 7px),':o.tex==='marble'?'linear-gradient(115deg,transparent 40%,rgba(90,95,100,.35) 46%,transparent 52%),':'';
      return extra+o.base;
    },'n-top');
    chips('c-cab',CABS,'cab',function(o){return o.c},'n-cab');
    chips('c-wall',WALLS,'wall',function(o){return o.thumb?'url('+o.thumb+') center/cover':o.c},'n-wall');
  }

  $('v-one').onclick=function(){S.view='one';render()};
  $('v-two').onclick=function(){S.view='two';render()};
  Array.prototype.forEach.call(document.querySelectorAll('[data-a]'),function(b){
    b.onclick=function(){S.angle=b.getAttribute('data-a');render()};
  });
  try{var q=new URLSearchParams(location.search).get('model')||location.hash.slice(1); if(q&&find(MODELS,q)) S.model=q;}catch(e){}
  render();
})();
</script>
</body>
</html>
